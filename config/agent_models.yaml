# Per-agent model + sampling routing.
#
# Lookup precedence (most specific wins):
#   1. agents.<name>.backends.<LLM_BACKEND>   — backend-specific override
#   2. agents.<name>.model                    — shared across backends
#   3. defaults.backends.<LLM_BACKEND>        — global backend override
#   4. defaults.model                         — global default
#   5. Legacy .env fallback (settings.analyst_model, valuer_model, …)
#
# Sampling follows the same pattern. A fully empty `sampling` block
# means "use the model-family recommended values from
# wise_investor.llm.utils.sampling" — that's the new policy for
# every agent out of the box. Override only when you know what you're
# doing (see docs/llm_backends.md, coming in Phase 7).
#
# This file is optional — delete it to revert to the .env-based
# routing that predates Phase 4.

defaults:
  # Leave `model` unset to defer to the .env routing
  # (ANALYST_MODEL / VALUER_MODEL / SKEPTIC_MODEL / STEWARD_MODEL).
  # That's the bundled-seed behavior: git pull alone changes nothing
  # in your model selection. Set this only if you want to centralize
  # the default in this file.
  # model: llama3.1:8b

  # Sampling intentionally empty — each agent will pick up the
  # model-family recommendation from wise_investor.llm.utils.sampling
  # (e.g. Qwen 2.5 → temperature 0.7 / top_p 0.8). Override only if
  # you have a specific reason. Deterministic-mode example:
  # sampling:
  #   temperature: 0.0
  #   seed: 42

  # Per-backend model overrides — handy when switching LLM_BACKEND
  # between Ollama and a hosted server that uses HuggingFace repo
  # names for the same weights.
  # backends:
  #   openai_compat: "meta-llama/Meta-Llama-3.1-8B-Instruct"
  #   mlx: "mlx-community/Llama-3.1-8B-Instruct-4bit"

agents:
  # Each crew agent. Empty entries mean "fall back to .env" — same
  # routing the runner used pre-Phase-4. Add a `model:` line below
  # to take a per-agent override without editing .env.
  economist:
  analyst:
  valuer:
  # P3-6/P3-7 (2026-04):
  #   v5: qwen2.5:7b-16k + old prompt → recall=0%, 5 INVALID
  #   v6: qwen2.5:14b   + old prompt → recall=0%, 6 INVALID
  #   v7: qwen2.5:7b-16k + new prompt → recall=14.3%, 1 INVALID
  #   v8: qwen2.5:14b   + new prompt → recall=0%,  0 INVALID
  # 14B improves format adherence (INVALID 1→0) but tightens
  # qualitative thresholds (frontier=PASS count went 3→0). 7B's
  # slight generosity is what allows TSM/ASML/NVDA to clear the
  # hierarchy gate. 14B + new prompt is strictly worse on recall.
  # Reverting to 7B-16k as the stable Stage 3 model. v9 (next)
  # will measure whether few-shot examples help recall further
  # without breaking precision.
  stage3_screener:
    model: qwen2.5:7b-16k
  skeptic:
    # Bear-side diversity example: switch to a Qwen3 thinking
    # variant only for Skeptic.
    # model: qwen3:14b
    # sampling:
    #   enable_thinking: true
  defender:
  steward:
    # To run Steward deterministically while letting other agents
    # sample freely, uncomment:
    # sampling:
    #   temperature: 0.0
    #   seed: 42
